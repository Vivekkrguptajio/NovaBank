# Runs MySQL + the Spring Boot API together:   docker compose up --build
# API:     http://localhost:8080/swagger-ui.html
# MySQL:   localhost:3307  (user root / password root)
services:
  mysql:
    image: mysql:8.4
    container_name: novabank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novabank
      TZ: Asia/Kolkata
    ports:
      - "3307:3306"          # 3307 on your PC so it doesn't clash with a local MySQL on 3306
    volumes:
      - novabank-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: novabank-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/novabank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: bm92YWJhbmstc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0yMDI2
    ports:
      - "8080:8080"

volumes:
  novabank-data:
